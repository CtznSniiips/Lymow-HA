# .github/workflows/discord-release.yml

name: Notify Discord on Release

on:
  release:
    types: [published]

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 << 'PY'
          import json
          import os
          import urllib.request

          webhook_url = os.environ["DISCORD_WEBHOOK_URL"]

          release_name = os.environ.get("RELEASE_NAME") or os.environ.get("RELEASE_TAG")
          release_tag = os.environ.get("RELEASE_TAG")
          release_url = os.environ.get("RELEASE_URL")
          release_body = os.environ.get("RELEASE_BODY") or "Nessuna descrizione."

          # Discord ha limiti di lunghezza sugli embed, quindi tagliamo le note
          if len(release_body) > 3500:
              release_body = release_body[:3500] + "\n\n..."

          payload = {
              "username": "GitHub Releases",
              "embeds": [
                  {
                      "title": f"🚀 New Release: {release_name}",
                      "url": release_url,
                      "description": release_body,
                      "fields": [
                          {
                              "name": "Versione",
                              "value": release_tag,
                              "inline": True
                          }
                      ]
                  }
              ]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHubActions-DiscordWebhook"
              },
              method="POST"
          )

          with urllib.request.urlopen(req) as response:
              print("Discord response:", response.status)
          PY
