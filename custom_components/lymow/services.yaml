start_zones:
  name: Start Zones
  description: Start mowing one or more specific zones by name or hashId.
  fields:
    zones:
      name: Zones
      description: List of zone names or hashIds to mow.
      required: true
      example: '["Front Lawn", "vfW8PgjE"]'
      selector:
        object:
    device_id:
      name: Device
      description: Target robot (only needed with multiple robots).
      required: false
      selector:
        device:
          integration: lymow

dock_cancel_task:
  name: Dock & Cancel Task
  description: Return to dock and cancel the current task (no recharge-resume).
  fields:
    device_id:
      name: Device
      description: Target robot (only needed with multiple robots).
      required: false
      selector:
        device:
          integration: lymow

cancel_task:
  name: Cancel Task
  description: Stop in place and reset to waiting state.
  fields:
    device_id:
      name: Device
      description: Target robot (only needed with multiple robots).
      required: false
      selector:
        device:
          integration: lymow